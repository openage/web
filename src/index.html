<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Pages</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" id="favicon" href="favicon.ico">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<style>
  :root {
    --primary: #0793CC;
    --neutral: #515151;
    --text-primary: #ffffff;
    --background: #F4F8FC;
    --error: #CE0C0C;
    --warn: #FF6666;
    --success: #28D716;
    --info: #3498db;
  }

  .card {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9999;
    text-align: center;
    background-image: radial-gradient(circle farthest-side, var(--background), var(--primary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Roboto, "Helvetica Neue", sans-serif;
  }

  /* Card Styles */
  .card>.content {
    height: auto;
    width: 400px;
    border-radius: 5px;
    padding: 50px 20px;
    background-color: white;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    text-align: center;
  }

  .card>.content>h1 {
    color: var(--primary);
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 16px 0;
  }

  .card.error>.content>h1 {
    color: var(--error);
  }

  .card>.content>p {
    color: var(--neutral);
    margin: 0 0 24px 0;
    line-height: 1.6;
    font-size: 14px;
  }

  .card>.content>button {
    padding: 10px 24px;
    background-color: var(--primary);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }

  .powered-by {
    color: var(--default);
    position: absolute;
    left: 50%;
    bottom: 10%;
    transform: translate(-50%, -10%);
  }

  .splash {
    text-align: center;
    position: fixed;
    /* width: 100%; */
    right: 0;
    top: 0px;
    left: 0;
    height: 100%;
    /* background-color: var(--background) !important; */
    background-image: radial-gradient(circle farthest-side, var(--background), var(--primary));
    overflow-y: auto;
    margin: auto;

  }

  .splash>div {
    height: 300px;
    width: 400px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    /* background-color: var(--text-secondary); */
    border-radius: 5px;
    padding: 50px 20px;
  }

  .splash img {
    max-height: 80%;
    min-height: 75px;
  }

  .splash h1 {
    color: var(--primary);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin: 40px auto;
    text-transform: uppercase;
  }

  .splash .progress {
    height: 6px;
    margin-top: 20%;

    transform: translate(-50%, -50%);
    position: absolute;
    left: 50%;
    top: 50%;
    width: 180px;

    padding: 1px;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 6px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px rgba(255, 255, 255, 0.08);
  }

  .splash .progress-bar {
    height: 4px;
    border-radius: 2px;
    transition: 0.4s linear;
    transition-property: width, background-color;

    background-color: var(--text-primary);
    width: 90%;
    animation: progressAnimationStrike 10s;
  }

  @keyframes progressAnimationStrike {
    from {
      width: 0
    }

    to {
      width: 90%
    }
  }



  /* Button Styles */
  button,
  a.button {
    display: inline-flex;
    line-height: inherit;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.3s ease;
    align-items: center;
    justify-content: center;
  }

  button:hover {
    opacity: 0.9;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  button.primary {
    background-color: var(--primary);
    color: white;
    border: none;
  }

  button.primary:hover {
    background-color: #0773b8;
  }

  button.secondary {
    background-color: #e0e0e0;
    color: #333;
    border: none;
  }

  button.secondary:hover {
    background-color: #d0d0d0;
  }

  button.success {
    background-color: #5b7a21;
    color: white;
    border: none;
  }

  button.warn {
    background-color: #ff9666;
    color: white;
    border: none;
  }

  button.error {
    background-color: #ce0c0c;
    color: white;
    border: none;
  }

  button.outlined {
    background-color: transparent;
    border: 1px solid var(--primary);
    color: var(--primary);
  }

  button.outlined:hover {
    background-color: rgba(7, 147, 204, 0.1);
  }

  /* Form Input Styles */
  input,
  textarea,
  select {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.3s ease;
  }

  input:focus,
  textarea:focus,
  select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(7, 147, 204, 0.1);
  }

  input:disabled,
  textarea:disabled,
  select:disabled {
    background-color: #f5f5f5;
    cursor: not-allowed;
  }

  /* Form Group */
  .form-group {
    margin-bottom: 16px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    color: #333;
    font-weight: 500;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    box-sizing: border-box;
  }

  /* Typography */
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    margin: 0;
    font-weight: 500;
    line-height: 1.8;
    color: #333;
  }

  h1 {
    font-size: 32px;
  }

  h2 {
    font-size: 24px;
  }

  h3 {
    font-size: 20px;
  }

  h4 {
    font-size: 16px;
  }

  h5 {
    font-size: 14px;
  }

  h6 {
    font-size: 12px;
  }

  p {
    margin: 0 0 12px 0;
    line-height: 1.6;
    color: #555;
  }

  /* Utility Classes */
  .text-primary {
    color: var(--primary);
  }

  .text-success {
    color: #5b7a21;
  }

  .text-warn {
    color: #ff9666;
  }

  .text-error {
    color: #ce0c0c;
  }

  .text-disabled {
    color: #999;
  }

  .bg-primary {
    background-color: var(--primary);
  }

  .bg-success {
    background-color: #5b7a21;
  }

  .bg-warn {
    background-color: #ff9666;
  }

  .bg-error {
    background-color: #ce0c0c;
  }

  .bg-light {
    background-color: #f5f5f5;
  }

  .text-center {
    text-align: center;
  }

  .text-left {
    text-align: left;
  }

  .text-right {
    text-align: right;
  }

  .m-0 {
    margin: 0;
  }

  .m-1 {
    margin: 4px;
  }

  .m-2 {
    margin: 8px;
  }

  .m-3 {
    margin: 12px;
  }

  .m-4 {
    margin: 16px;
  }

  .p-0 {
    padding: 0;
  }

  .p-1 {
    padding: 4px;
  }

  .p-2 {
    padding: 8px;
  }

  .p-3 {
    padding: 12px;
  }

  .p-4 {
    padding: 16px;
  }

  .mt-1 {
    margin-top: 4px;
  }

  .mt-2 {
    margin-top: 8px;
  }

  .mt-3 {
    margin-top: 12px;
  }

  .mt-4 {
    margin-top: 16px;
  }

  .mb-1 {
    margin-bottom: 4px;
  }

  .mb-2 {
    margin-bottom: 8px;
  }

  .mb-3 {
    margin-bottom: 12px;
  }

  .mb-4 {
    margin-bottom: 16px;
  }

  .hidden {
    display: none !important;
  }

  .visible {
    display: block !important;
  }

  .flex {
    display: flex;
  }

  .flex-row {
    flex-direction: row;
  }

  .flex-column {
    flex-direction: column;
  }

  .justify-center {
    justify-content: center;
  }

  .justify-between {
    justify-content: space-between;
  }

  .align-center {
    align-items: center;
  }

  .flex-grow {
    flex-grow: 1;
  }

  /* Alert/Message Styles */
  .alert {
    padding: 12px 16px;
    border-radius: 4px;
    margin-bottom: 16px;
    border-left: 4px solid;
  }

  .alert-success {
    background-color: #f0fde4;
    border-color: #5b7a21;
    color: #5b7a21;
  }

  .alert-info {
    background-color: #e3f2fd;
    border-color: var(--primary);
    color: var(--primary);
  }

  .alert-warn {
    background-color: #fff8e1;
    border-color: #ff9666;
    color: #ff9666;
  }

  .alert-error {
    background-color: #ffebee;
    border-color: #ce0c0c;
    color: #ce0c0c;
  }
</style>

<body class="mat-typography">
  <div>
    <app-root>
      <div class="splash">
        <div>
          <img id="tenant-splash" src="" alt="splash" style="visibility: hidden;">
          <div class="progress progress-striped">
            <div class="progress-bar">
            </div>
          </div>
        </div>
      </div>
    </app-root>
  </div>
  <script>

    (function () {
      let app = window.sessionStorage.getItem('application');

      if (!app) {
        app = window.localStorage.getItem('application');
      }

      if (!app) {
        return
      }

      app = JSON.parse(app);
      let splash = document.getElementById('tenant-splash');
      if (splash) {
        let splashUrl = app.logo.url;
        if (app.splash && app.splash.url) {
          splashUrl = app.splash.url;
        }
        splash.src = splashUrl;
        splash.style.visibility = 'visible';
      }
      document.title = app.title;
      let fav = document.getElementById('favicon');
      let faviconUrl = app.logo.url;
      if (app.favicon && app.favicon.url) {
        faviconUrl = app.favicon.url;
      }
      fav.setAttribute('href', faviconUrl);
    })();
    (function (i, s, o, g, r, a, m) {
      i['GoogleAnalyticsObject'] = r;
      i[r] = i[r] || function () {
        (i[r].q = i[r].q || []).push(arguments)
      }, i[r].l = 1 * new Date();
      a = s.createElement(o),
        m = s.getElementsByTagName(o)[0];
      a.async = 1;
      a.src = g;
      m.parentNode.insertBefore(a, m)
    })(window, document, 'script', 'https://www.google-analytics.com/analytics.js', 'ga');

    ga('create', 'UA-85934219-6', 'auto');
    // ga('create', 'UA-85934219-6', 'none'); // 'none' while you are working on localhost
    // ga('send', 'pageview');
  </script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

</body>

</html>
