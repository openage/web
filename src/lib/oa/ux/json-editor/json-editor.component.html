@if(text)
{
<div class="oa-input">
  <textarea class="input json" spellcheck="false" aria-label="JSON source" [value]="text || ''"
    (focus)="onSelect()" (blur)="onBlur()" (input)="onTextChange($event)" (keydown)="onKeydown($event)"></textarea>
  @if (parseError) { <p class="json-editor-error" role="alert">{{ parseError }}</p> }
</div>
}
