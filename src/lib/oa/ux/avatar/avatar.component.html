<div [oaTooltip]="tooltipText | titlecase">
  @switch (view) {
  @case ('avatar') {
  <ng-container *ngTemplateOutlet="avatar"></ng-container>
  }

  @case ('selectable') {
  <div class="selectable controls-row" [class.selected]="selected">
    <ng-container *ngTemplateOutlet="avatar"></ng-container>
    @if(selected) {
    <span tabindex="0" role="button" (click)="onClick()" (keydown.enter)="onClick()"
      (keydown.space)="$event.preventDefault(); onClick()">{{tooltipText | titlecase}}</span>
    }
  </div>
  }

  @case ('text') {
  <span tabindex="0" role="button" (click)="onClick()" (keydown.enter)="onClick()"
    (keydown.space)="$event.preventDefault(); onClick()">{{tooltipText | titlecase}}</span>
  }

  @case ('pic') {
  <div class="oa-avatar oa-avatar--photo" tabindex="0" role="button" [style]="style" (click)="onClick()"
    (keydown.enter)="onClick()" (keydown.space)="$event.preventDefault(); onClick()"></div>
  }

  }
</div>

<ng-template #avatar>
  @if (!url && !pic) {
  <div class="oa-avatar oa-avatar--initials" tabindex="0" role="button" [style]="style" (click)="onClick()"
    (keydown.enter)="onClick()" (keydown.space)="$event.preventDefault(); onClick()">{{text}}</div>
  }

  @if (url || pic) {
  <div class="oa-avatar oa-avatar--photo" tabindex="0" role="button" [style]="style" (click)="onClick()"
    (keydown.enter)="onClick()" (keydown.space)="$event.preventDefault(); onClick()"></div>
  }
</ng-template>
