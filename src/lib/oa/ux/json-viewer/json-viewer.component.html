<ng-container *ngTemplateOutlet="renderJson; context: { items: items }"></ng-container>

<ng-template #renderJson let-items="items">
  <ul class="tree">
    @for (item of items; track item) {
      <li class="tree-node">
        <div class="tree-row" (dblclick)="item.isComplex && toggle(item)">
          <span class="label">{{ item.key }}</span>
          @if (item.isComplex) {
            <span class="value complex-value">
              @if (item.isArray) {
                Array[{{ item.value.length }}]
              } @else {
                Object
              }
            </span>
            <button
              class="toggle"
              type="button"
              [attr.aria-expanded]="!item.isCollapsed"
              [attr.aria-label]="(item.isCollapsed ? 'Expand ' : 'Collapse ') + item.key"
              (click)="toggle(item)">
              {{ item.isCollapsed ? '+' : '−' }}
            </button>
          } @else {
            <span
              class="value"
              [class.string-value]="item.type === 'string'"
              [class.number-value]="item.type === 'number'"
              [class.boolean-value]="item.type === 'boolean'"
              [class.null-value]="item.value === null">
              {{ item.value === null ? 'null' : item.value }}
            </span>
          }
        </div>
        @if (item.isComplex && !item.isCollapsed) {
          <ng-container *ngTemplateOutlet="renderJson; context: { items: item.items }"></ng-container>
        }
      </li>
    }
  </ul>
</ng-template>
