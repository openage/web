<section class="login-card" [ngStyle]="style" [ngClass]="class">

  @if(label) {
  <div class="label">{{ label }}</div>
  }

  <form class="login-form" (ngSubmit)="login()" #loginForm="ngForm">
    <label for="identity">Email or mobile number</label>
    <input id="identity" name="identity" [(ngModel)]="identity" autocomplete="username" placeholder="you@example.com"
      required>
    <label for="password">Password</label>
    <input id="password" name="password" [(ngModel)]="password" type="password" autocomplete="current-password"
      required>
    @if(error) {
    <p class="login-error" role="alert">{{ error }}</p>
    }
    <button class="login-submit" type="submit" [disabled]="loginForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Logging in…' : 'Login' }}
    </button>
  </form>

  @if(config.signup) {
  <div class="login-signup">
    Not registered? <button type="button" class="link-button" (click)="signUp()">{{config.signup}}</button>
  </div>
  }
</section>
