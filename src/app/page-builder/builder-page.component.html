<ng-template #canvasTemplate let-item="item">
  <oa-canvas [value]="workspaceData()" [options]="item.options || {}" [selection]="canvasSelection"
    [activeTool]="activeToolDrag()" [toolboxDropListIds]="toolboxDropListIds" [validationErrors]="validationErrors()"
    [loadError]="loadError()" (sectionSelected)="onCanvasSelection($event)" (toolDropped)="onCanvasToolDropped($event)"
    (itemDropped)="onCanvasItemDropped($event)" (itemAction)="onCanvasItemAction($event)"></oa-canvas>
</ng-template>

<ng-template #toolboxTemplate let-item="item">
  <oa-toolbox [options]="item.options || {}" [value]="canvasSelection?.groupCode || ''"
    [connectedTo]="canvasDropListIds" [disabled]="!workspaceValid()"
    (toolDragStart)="onToolDragStart($any($event))" (toolDragEnd)="onToolDragEnd()"
    (toolSelected)="onToolSelected($any($event))"></oa-toolbox>
</ng-template>

<ng-template #propertiesTemplate let-item="item">
  <oa-properties [value]="propertiesData" [type]="propertiesType" [options]="propertiesOptions(item.options || {})"
    (valueChange)="onPropertiesChange($event)"></oa-properties>
</ng-template>

@if (layout && isInitialized) {
<main [id]="page?.code" class="builder-page-layout builder-workspace" [class.hidden]="!isCurrent">
  <div class="builder-editor-surface" [class.preview-active]="previewMode()">
    <oa-layout [layout]="layout" [params]="params" [components]="components" [templates]="templates"></oa-layout>
    @if (previewMode()) {
    <section class="builder-live-preview" aria-label="Page preview">
      <div class="builder-preview-frame" [class.viewport-tablet]="previewViewport() === 'tablet'"
        [class.viewport-mobile]="previewViewport() === 'mobile'">
        @if (hasPreviewSections()) {
        <oa-layout class="builder-preview-page" [layout]="previewLayout()" [params]="{}"
          [components]="previewComponents()" [data]="{}"></oa-layout>
        } @else {
        <p class="builder-preview-empty">Add sections to see the page preview.</p>
        }
      </div>
    </section>
    }
  </div>
</main>
}
